version: "3.9"

services:
  agent:
    build: .
    container_name: enterprise_claw
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      # Persist all storage between container restarts
      - ./storage:/app/storage
      - ./skills/custom:/app/skills/custom
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  whatsapp:
    build:
      context: .
      dockerfile: whatsapp/Dockerfile
    container_name: enterprise_claw_whatsapp
    restart: unless-stopped
    ports:
      - "${WHATSAPP_PORT:-8001}:8001"
    env_file:
      - .env
    environment:
      - AGENT_BASE_URL=http://agent:8000
      - PYTHONUNBUFFERED=1
    depends_on:
      agent:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: enterprise_claw_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - agent
      - whatsapp
    profiles:
      - production
